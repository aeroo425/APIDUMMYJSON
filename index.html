<!DOCTYPE html>
<html>
<head>
    <title>Katalog Produk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header>
    <h2 class="logo">MyShop</h2>
    <div class="search-box">
        <input type="text" id="search" placeholder="Cari produk...">
        <button onclick="searchProduct()">Cari</button>
    </div>
</header>

<!-- BANNER -->
<section class="banner">
    <h1>Promo Spesial 🔥</h1>
    <p>Diskon besar-besaran hari ini!</p>
</section>

<!-- KATEGORI -->
<section class="kategori">
    <div class="kat-item">📱 Elektronik</div>
    <div class="kat-item">👕 Fashion</div>
    <div class="kat-item">🏠 Rumah</div>
    <div class="kat-item">💄 Kecantikan</div>
</section>

<!-- PRODUK -->
<h2 class="judul">Produk Terbaru</h2>
<div id="product-list" class="grid"></div>

<script src="script.js"></script>
</body>
</html>
